name: Deploy Awesome Apertus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check generated pages
        run: |
          test -s _site/index.html
          test -s _site/RESEARCH.html
          test -s _site/CONTRIBUTING.html
          test -s _site/LICENSE
          grep -q 'id="official-models"' _site/index.html
          grep -q 'href="/awesome-apertus/RESEARCH.html"' _site/index.html
          grep -q 'href="/awesome-apertus/CONTRIBUTING.html"' _site/index.html
          test ! -e _site/SKILL.html
          test ! -e _site/pyproject.toml
          test ! -d _site/src

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
